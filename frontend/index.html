<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'><circle cx='26' cy='26' r='24' fill='none' stroke='%23087f7a' stroke-width='2.5'/><ellipse cx='26' cy='26' rx='39' ry='11' fill='none' stroke='%23e0a323' stroke-width='2.5' transform='rotate(-28 26 26)'/><circle cx='26' cy='26' r='6' fill='%23b83280'/></svg>" />
    <script>
      // Set the theme before first paint (React re-asserts it after mount).
      // Snapshot/report renders (?snapshot=1) are always light — print-friendly.
      try {
        var snap = new URLSearchParams(location.search).get('snapshot') === '1'
        document.documentElement.setAttribute('data-theme', snap ? 'light' : (localStorage.getItem('orbit-theme') || 'dark'))
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark') }
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
      :root { color-scheme: light; --canvas: #f6f7fa; --ink: #1b2333; --surface: #ffffff; --border: #e6e9ee; --scroll: #c9d0dc; --accent: #4a68e0; }
      [data-theme="dark"] { color-scheme: dark; --canvas: #0e1116; --ink: #e8ecf2; --surface: #161b23; --border: #252c37; --scroll: #323b49; --accent: #5b7cfa; }
      body { background: var(--canvas); color: var(--ink); transition: background-color 200ms ease, color 200ms ease; }
      button, a { transition: background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease, color 160ms ease, transform 160ms ease; }
      button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(91,124,250,0.14); }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }
      input, select, button, textarea { font-family: inherit; }
      table { border-collapse: collapse; }
      input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
